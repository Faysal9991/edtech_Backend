name: lms-phase1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me-now
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin change-me-now &&
        mc mb --ignore-existing local/lms-private &&
        mc anonymous set none local/lms-private
  migrate:
    profiles: ["tools"]
    build:
      context: .
      args: {TARGET: migrate}
    command: ["up"]
    environment: &app-env
      APP_ENV: development
      APP_NAME: lms-backend
      DATABASE_URL: postgres://lms:lms@postgres:5432/lms?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lms-private
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: change-me-now
      S3_FORCE_PATH_STYLE: "true"
      FIREBASE_PROJECT_ID: local-firebase-project
      FAKE_AUTH_ENABLED: "true"
      DEVICE_TOKEN_ENCRYPTION_KEY: local-only-device-token-key-change-me-123456
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: local-livekit-key
      LIVEKIT_API_SECRET: local-livekit-secret-change-me
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_replace_me
      PUBLIC_API_URL: http://localhost:8080
      CERTIFICATE_VERIFY_BASE_URL: http://localhost:8080/api/v1/public/certificates/verify
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    profiles: ["tools"]
    build:
      context: .
      args: {TARGET: seed}
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      args: {TARGET: api}
    environment:
      <<: *app-env
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"
  worker:
    build:
      context: .
      args: {TARGET: worker}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
volumes:
  postgres_data:
  redis_data:
  minio_data:

