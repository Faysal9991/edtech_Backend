openapi: 3.1.0
info:
  title: LMS Service API
  version: 1.0.0
  description: Phase-1 LMS REST API. Timestamps are UTC and money uses integer minor units.
servers:
  - url: /
security:
  - BearerAuth: []
tags:
  - {name: Authentication}
  - {name: Users}
  - {name: Courses}
  - {name: Media}
  - {name: Learning}
  - {name: Assessments}
  - {name: Live classes}
  - {name: Payments}
  - {name: Notifications}
  - {name: Reporting}
paths:
  /health/live:
    get: {operationId: liveness, security: [], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /health/ready:
    get: {operationId: readiness, security: [], responses: {'200': {$ref: '#/components/responses/OK'}, '503': {$ref: '#/components/responses/Problem'}}}
  /metrics:
    get: {operationId: metrics, security: [], responses: {'200': {description: Prometheus exposition, content: {text/plain: {schema: {type: string}}}}}}
  /openapi.yaml:
    get: {operationId: openAPISpec, security: [], responses: {'200': {description: OpenAPI document}}}
  /docs:
    get: {operationId: swaggerUI, security: [], responses: {'200': {description: Swagger UI}}}

  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Authentication]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}, example: {email: student@example.com, password: a-long-unique-passphrase, display_name: Example Student}}}}
      responses: {'201': {description: Pending account created, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationResponse'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}, example: {email: student@example.com, password: a-long-unique-passphrase}}}}
      responses: {'200': {$ref: '#/components/responses/Tokens'}, '401': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/refresh:
    post: {operationId: refresh, tags: [Authentication], security: [], requestBody: {$ref: '#/components/requestBodies/RefreshToken'}, responses: {'200': {$ref: '#/components/responses/Tokens'}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/logout:
    post: {operationId: logout, tags: [Authentication], requestBody: {$ref: '#/components/requestBodies/RefreshToken'}, responses: {'204': {description: Current session revoked}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/logout-all:
    post: {operationId: logoutAll, tags: [Authentication], responses: {'204': {description: All sessions revoked}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/me:
    get: {operationId: currentUser, tags: [Authentication], responses: {'200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/AuthUser'}}}}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/change-password:
    post: {operationId: changePassword, tags: [Authentication], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}}, responses: {'204': {description: Password changed and sessions revoked}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/forgot-password:
    post: {operationId: forgotPassword, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}, example: {email: student@example.com}}}}, responses: {'202': {description: Generic accepted response}, '429': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/reset-password:
    post: {operationId: resetPassword, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}, responses: {'204': {description: Password reset}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/verify-email:
    post: {operationId: verifyEmail, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRequest'}}}}, responses: {'204': {description: Email verified}, '401': {$ref: '#/components/responses/Problem'}}}

  /api/v1/users/me:
    patch: {operationId: updateCurrentProfile, tags: [Users], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/users:
    get: {operationId: adminListUsers, tags: [Users], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: q, in: query, schema: {type: string, maxLength: 200}}, {name: status, in: query, schema: {type: string, enum: [pending, active, suspended, disabled]}}, {name: role, in: query, schema: {type: string, enum: [student, teacher, admin]}}], responses: {'200': {$ref: '#/components/responses/List'}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: adminGetUser, tags: [Users], responses: {'200': {$ref: '#/components/responses/OK'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/users/{id}/status:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: adminSetUserStatus, tags: [Users], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserStatusWrite'}, example: {status: suspended}}}}, responses: {'204': {description: Account state changed}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/users/{id}/roles:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: adminReplaceUserRoles, tags: [Users], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}, example: {roles: [teacher]}}}}, responses: {'200': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}

  /api/v1/courses:
    get: {operationId: listCourses, tags: [Courses], security: [], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: q, in: query, schema: {type: string}}, {name: organization_id, in: query, schema: {type: string, format: uuid}}, {name: category_id, in: query, schema: {type: string, format: uuid}}, {name: level, in: query, schema: {type: string, enum: [beginner, intermediate, advanced, all]}}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/courses/{slug}:
    parameters: [{$ref: '#/components/parameters/Slug'}]
    get: {operationId: getPublishedCourse, tags: [Courses], security: [], responses: {'200': {description: Course with ordered modules and published lessons}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/courses:
    get: {operationId: teacherListCourses, tags: [Courses], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
    post: {operationId: teacherCreateCourse, tags: [Courses], requestBody: {$ref: '#/components/requestBodies/CourseWrite'}, responses: {'201': {$ref: '#/components/responses/Course'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/courses/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: teacherGetCourse, tags: [Courses], responses: {'200': {description: Course detail}, '403': {$ref: '#/components/responses/Problem'}}}
    patch: {operationId: teacherUpdateCourse, tags: [Courses], requestBody: {$ref: '#/components/requestBodies/CourseWrite'}, responses: {'200': {$ref: '#/components/responses/Course'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/courses/{id}/submit-review:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherSubmitCourseReview, tags: [Courses], responses: {'200': {$ref: '#/components/responses/Course'}}}
  /api/v1/admin/courses/{id}/publish:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminPublishCourse, tags: [Courses], responses: {'200': {$ref: '#/components/responses/Course'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/courses/{id}/modules:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherCreateModule, tags: [Courses], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModuleWrite'}, example: {title: Foundations, position: 1}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/modules/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: teacherUpdateModule, tags: [Courses], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModuleWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}
    delete: {operationId: teacherDeleteModule, tags: [Courses], responses: {'204': {description: Draft module deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/modules/{id}/lessons:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherCreateLesson, tags: [Courses], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LessonWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/lessons/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: teacherUpdateLesson, tags: [Courses], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LessonWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}
    delete: {operationId: teacherDeleteLesson, tags: [Courses], responses: {'204': {description: Lesson deleted}, '409': {$ref: '#/components/responses/Problem'}}}

  /api/v1/media/upload-intents:
    post:
      operationId: createUploadIntent
      tags: [Media]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadIntentWrite'}, example: {kind: pdf, filename: handout.pdf, content_type: application/pdf, size_bytes: 24576}}}}
      responses:
        '201': {description: Direct-upload intent, content: {application/json: {schema: {$ref: '#/components/schemas/UploadIntent'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/media/{id}/complete:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: completeMediaUpload, tags: [Media], responses: {'202': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/media/{id}/access-url:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getMediaAccessURL, tags: [Media], responses: {'200': {$ref: '#/components/responses/OK'}, '403': {$ref: '#/components/responses/Problem'}}}

  /api/v1/courses/{id}/enroll:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: enrollFreeCourse, tags: [Learning], responses: {'201': {description: Active enrollment, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}, '402': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/enrollments:
    get: {operationId: studentListEnrollments, tags: [Learning], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/student/enrollments/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: studentGetEnrollment, tags: [Learning], responses: {'200': {description: Owned enrollment}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/enrollments/{id}/lessons/{lessonId}/progress:
    parameters: [{$ref: '#/components/parameters/ID'}, {name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}]
    put: {operationId: studentUpdateProgress, tags: [Learning], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressWrite'}}}}, responses: {'200': {description: Idempotently updated progress, content: {application/json: {schema: {$ref: '#/components/schemas/Progress'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/enrollments:
    get: {operationId: adminListEnrollments, tags: [Learning], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {type: string}}, {name: course_id, in: query, schema: {type: string, format: uuid}}, {name: student_id, in: query, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/List'}}}

  /api/v1/teacher/quizzes:
    get: {operationId: teacherListQuizzes, tags: [Assessments], parameters: [{$ref: '#/components/parameters/CourseID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
    post: {operationId: teacherCreateQuiz, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuizWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/quizzes/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: teacherGetQuiz, tags: [Assessments], responses: {'200': {description: Quiz and answer-key question bank}}}
    patch: {operationId: teacherUpdateQuiz, tags: [Assessments], parameters: [{name: status, in: query, schema: {type: string, enum: [draft, published, archived]}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuizWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}
    delete: {operationId: teacherDeleteQuiz, tags: [Assessments], responses: {'204': {description: Draft quiz deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/quizzes/{id}/questions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherCreateQuizQuestion, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/quiz-questions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: teacherUpdateQuizQuestion, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: teacherDeleteQuizQuestion, tags: [Assessments], responses: {'204': {description: Question deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/quizzes/{id}/attempts:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: studentListQuizAttempts, tags: [Assessments], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
    post: {operationId: studentStartQuizAttempt, tags: [Assessments], responses: {'201': {description: Attempt with no answer-key flags, content: {application/json: {schema: {$ref: '#/components/schemas/QuizAttempt'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/quiz-attempts/{id}/answers:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: studentSaveQuizAnswer, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnswerWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/quiz-attempts/{id}/submit:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: studentSubmitQuizAttempt, tags: [Assessments], responses: {'200': {description: Server-scored result}, '409': {$ref: '#/components/responses/Problem'}}}

  /api/v1/teacher/assignments:
    get: {operationId: teacherListAssignments, tags: [Assessments], parameters: [{$ref: '#/components/parameters/CourseID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
    post: {operationId: teacherCreateAssignment, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/assignments/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: teacherGetAssignment, tags: [Assessments], responses: {'200': {$ref: '#/components/responses/OK'}}}
    patch: {operationId: teacherUpdateAssignment, tags: [Assessments], parameters: [{name: status, in: query, schema: {type: string, enum: [draft, published, archived]}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}
    delete: {operationId: teacherDeleteAssignment, tags: [Assessments], responses: {'204': {description: Draft assignment deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/assignments/{id}/submissions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: studentCreateSubmission, tags: [Assessments], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmissionWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/submissions/{id}/submit:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: studentSubmitAssignment, tags: [Assessments], responses: {'200': {$ref: '#/components/responses/OK'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/submissions/{id}/grade:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: teacherGradeSubmission, tags: [Assessments], parameters: [{name: return_for_resubmission, in: query, schema: {type: boolean, default: false}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GradeWrite'}, example: {points: 95, feedback: Excellent work.}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}

  /api/v1/teacher/live-classes:
    get: {operationId: teacherListLiveClasses, tags: [Live classes], parameters: [{name: status, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
    post: {operationId: teacherCreateLiveClass, tags: [Live classes], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LiveSessionWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/live-classes/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: teacherGetLiveClass, tags: [Live classes], responses: {'200': {$ref: '#/components/responses/OK'}}}
    patch: {operationId: teacherUpdateLiveClass, tags: [Live classes], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LiveSessionWrite'}}}}, responses: {'200': {$ref: '#/components/responses/OK'}}}
    delete: {operationId: teacherCancelLiveClass, tags: [Live classes], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/live-classes/{id}/start:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherStartLiveClass, tags: [Live classes], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/live-classes/{id}/end:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: teacherEndLiveClass, tags: [Live classes], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/live-classes/{id}/token:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: liveClassToken, tags: [Live classes], responses: {'200': {description: Room-scoped publisher/subscriber token, content: {application/json: {schema: {$ref: '#/components/schemas/JoinToken'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/webhooks/livekit:
    post: {operationId: liveKitWebhook, tags: [Live classes], security: [], responses: {'204': {description: Signed event accepted}, '400': {$ref: '#/components/responses/Problem'}}}

  /api/v1/payments/orders:
    post: {operationId: createPaymentOrder, tags: [Payments], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderWrite'}}}}, responses: {'201': {description: Payment order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/payments/orders/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getPaymentOrder, tags: [Payments], responses: {'200': {description: Owned order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/payments/orders/{id}/payment-intent:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: createPaymentIntent, tags: [Payments], responses: {'200': {description: Provider client secret, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntent'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/payments/webhooks/stripe:
    post: {operationId: stripeWebhook, tags: [Payments], security: [], responses: {'204': {description: Signed idempotent event accepted}, '400': {$ref: '#/components/responses/Problem'}}}
  /api/v1/student/payments:
    get: {operationId: studentPaymentHistory, tags: [Payments], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/admin/payments:
    get: {operationId: adminPaymentHistory, tags: [Payments], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {type: string}}, {name: user_id, in: query, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/List'}}}

  /api/v1/student/results:
    get: {operationId: studentResults, tags: [Learning], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/student/certificates:
    get: {operationId: studentCertificates, tags: [Learning], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/student/certificates/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: studentCertificateDownload, tags: [Learning], responses: {'302': {description: Redirect to a short-lived signed private URL}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/certificates/verify/{certificateNumber}:
    parameters: [{name: certificateNumber, in: path, required: true, schema: {type: string}}]
    get: {operationId: verifyCertificate, tags: [Learning], security: [], responses: {'200': {description: Safe verification data, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateVerification'}}}}, '404': {$ref: '#/components/responses/Problem'}}}

  /api/v1/notifications:
    get: {operationId: listNotifications, tags: [Notifications], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/List'}}}
  /api/v1/notifications/unread-count:
    get: {operationId: unreadNotificationCount, tags: [Notifications], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/notifications/{id}/read:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: markNotificationRead, tags: [Notifications], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/devices:
    post: {operationId: registerDevice, tags: [Notifications], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceTokenWrite'}}}}, responses: {'201': {$ref: '#/components/responses/OK'}}}
  /api/v1/devices/{token}:
    parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 4096}}]
    delete: {operationId: removeDevice, tags: [Notifications], responses: {'204': {description: Device token removed}}}

  /api/v1/admin/reports/overview:
    get: {operationId: adminOverviewReport, tags: [Reporting], parameters: [{$ref: '#/components/parameters/ReportFrom'}, {$ref: '#/components/parameters/ReportTo'}], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/admin/reports/revenue:
    get: {operationId: adminRevenueReport, tags: [Reporting], parameters: [{$ref: '#/components/parameters/ReportFrom'}, {$ref: '#/components/parameters/ReportTo'}], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /api/v1/teacher/reports/overview:
    get: {operationId: teacherOverviewReport, tags: [Reporting], parameters: [{$ref: '#/components/parameters/ReportFrom'}, {$ref: '#/components/parameters/ReportTo'}], responses: {'200': {$ref: '#/components/responses/OK'}}}

components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: Short-lived LMS access JWT. Refresh tokens are accepted only by refresh/logout.}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Slug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 180}}
    CourseID: {name: course_id, in: query, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque timestamp and UUID tie-breaker.}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    ReportFrom: {name: from, in: query, schema: {type: string, format: date-time}}
    ReportTo: {name: to, in: query, schema: {type: string, format: date-time}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
  requestBodies:
    CourseWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CourseWrite'}, example: {title: Production Go, slug: production-go, description: Practical Go systems., language: en, level: intermediate, is_free: true, price_minor: 0, currency: BDT, version: 0}}}}
    RefreshToken: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], additionalProperties: false, properties: {refresh_token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}}}}}}
  responses:
    OK: {description: Successful response, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
    List: {description: Cursor-paginated list, content: {application/json: {schema: {$ref: '#/components/schemas/ListResponse'}}}}
    Course: {description: Course, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
    Problem: {description: RFC 7807 problem details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Tokens: {description: Rotating access and refresh pair, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status]
      example: {type: about:blank, title: Forbidden, status: 403, detail: active enrollment is required, request_id: 018f4d4e-8b57-7bf0-a250-3bb54f2ab31a}
      properties: {type: {type: string, format: uri-reference}, title: {type: string}, status: {type: integer}, detail: {type: string}, instance: {type: string}, request_id: {type: string}, errors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}}
    FieldError: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    ListResponse: {type: object, required: [items], properties: {items: {type: array, items: {}}, next_cursor: {type: string}}}
    RegisterRequest: {type: object, required: [email, password, display_name], additionalProperties: false, properties: {email: {type: string, format: email, maxLength: 320}, password: {type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true}, display_name: {type: string, minLength: 2, maxLength: 120}}}
    LoginRequest: {type: object, required: [email, password], additionalProperties: false, properties: {email: {type: string, format: email, maxLength: 320}, password: {type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true}}}
    ChangePasswordRequest: {type: object, required: [current_password, new_password], additionalProperties: false, properties: {current_password: {type: string, format: password, writeOnly: true}, new_password: {type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true}}}
    ForgotPasswordRequest: {type: object, required: [email], additionalProperties: false, properties: {email: {type: string, format: email}}}
    ResetPasswordRequest: {type: object, required: [token, new_password], additionalProperties: false, properties: {token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}, new_password: {type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true}}}
    TokenRequest: {type: object, required: [token], additionalProperties: false, properties: {token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}}}
    TokenPair: {type: object, required: [access_token, refresh_token, token_type, expires_at], properties: {access_token: {type: string, writeOnly: true}, refresh_token: {type: string, writeOnly: true}, token_type: {type: string, const: Bearer}, expires_at: {$ref: '#/components/schemas/Timestamp'}}}
    AuthUser: {type: object, required: [id, email, display_name, status, roles], properties: {id: {$ref: '#/components/schemas/UUID'}, email: {type: string, format: email}, display_name: {type: string}, status: {type: string, enum: [pending, active, suspended, disabled]}, roles: {type: array, uniqueItems: true, items: {type: string, enum: [student, teacher, admin]}}, email_verified_at: {$ref: '#/components/schemas/Timestamp'}}}
    RegistrationResponse: {type: object, required: [user, message], properties: {user: {$ref: '#/components/schemas/AuthUser'}, message: {type: string}, verification_token: {type: string, writeOnly: true, description: Development/test only.}}}
    User:
      type: object
      required: [id, email, display_name, status, memberships]
      properties: {id: {$ref: '#/components/schemas/UUID'}, email: {type: string, format: email}, display_name: {type: string}, status: {type: string, enum: [pending, active, suspended, disabled]}, memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}}
    ProfileWrite: {type: object, required: [display_name], additionalProperties: false, properties: {display_name: {type: string, minLength: 2, maxLength: 120}, first_name: {type: string, maxLength: 100}, last_name: {type: string, maxLength: 100}, phone: {type: string, maxLength: 32}, timezone: {type: string}, locale: {type: string}, biography: {type: string, maxLength: 5000}, expertise: {type: array, maxItems: 50, items: {type: string}}}}
    UserStatusWrite: {type: object, required: [status], additionalProperties: false, properties: {status: {type: string, enum: [pending, active, suspended, disabled]}}}
    RoleWrite: {type: object, required: [roles], additionalProperties: false, properties: {roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [student, teacher, admin]}}}}
    Membership: {type: object, required: [id, organization_id, organization_name, status, roles], properties: {id: {$ref: '#/components/schemas/UUID'}, organization_id: {$ref: '#/components/schemas/UUID'}, organization_name: {type: string}, status: {type: string}, roles: {type: array, items: {type: string, enum: [super_admin, organization_admin, instructor, student]}}}}
    MembershipUpdate: {type: object, required: [status, roles], properties: {status: {type: string, enum: [active, suspended]}, roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [organization_admin, instructor, student]}}}}
    OrganizationWrite: {type: object, required: [name, slug], properties: {name: {type: string, minLength: 2, maxLength: 200}, slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}}}
    InvitationWrite: {type: object, required: [email, role], properties: {email: {type: string, format: email}, role: {type: string, enum: [organization_admin, instructor, student]}}}
    InvitationAccept: {type: object, required: [token], properties: {token: {type: string, minLength: 20}}}
    CategoryWrite: {type: object, required: [name, slug], properties: {name: {type: string, minLength: 2}, slug: {type: string}, description: {type: string}}}
    Course:
      type: object
      required: [id, organization_id, title, slug, description, language, level, status, is_free, price_minor, currency, version]
      properties: {id: {$ref: '#/components/schemas/UUID'}, organization_id: {$ref: '#/components/schemas/UUID'}, thumbnail_asset_id: {$ref: '#/components/schemas/UUID'}, title: {type: string}, slug: {type: string}, description: {type: string}, language: {type: string}, level: {type: string, enum: [beginner, intermediate, advanced, all]}, status: {type: string, enum: [draft, review, published, archived]}, is_free: {type: boolean}, price_minor: {type: integer, format: int64}, currency: {type: string, minLength: 3, maxLength: 3}, version: {type: integer, format: int64}}
    CourseWrite:
      type: object
      required: [title, slug, description, language, level, is_free, price_minor, currency, version]
      properties: {title: {type: string, minLength: 2, maxLength: 250}, slug: {type: string}, description: {type: string}, category_id: {$ref: '#/components/schemas/UUID'}, thumbnail_asset_id: {$ref: '#/components/schemas/UUID'}, language: {type: string}, level: {type: string, enum: [beginner, intermediate, advanced, all]}, is_free: {type: boolean}, price_minor: {type: integer, format: int64, minimum: 0}, currency: {type: string, minLength: 3, maxLength: 3}, version: {type: integer, format: int64, minimum: 0}}
    InstructorAssignment: {type: object, required: [instructor_id], properties: {instructor_id: {$ref: '#/components/schemas/UUID'}}}
    ModuleWrite: {type: object, required: [title, position], properties: {title: {type: string}, description: {type: string}, position: {type: integer, minimum: 1}}}
    LessonWrite: {type: object, required: [title, lesson_type, position, is_preview, is_required, is_published], properties: {title: {type: string}, description: {type: string}, lesson_type: {type: string, enum: [video, pdf, text, live, quiz, assignment]}, media_asset_id: {$ref: '#/components/schemas/UUID'}, body: {type: string}, position: {type: integer, minimum: 1}, is_preview: {type: boolean}, is_required: {type: boolean}, is_published: {type: boolean}, duration_seconds: {type: integer, minimum: 0}}}
    UploadIntentWrite: {type: object, required: [kind, filename, content_type, size_bytes], properties: {kind: {type: string, enum: [video, pdf, image, assignment]}, filename: {type: string}, content_type: {type: string}, size_bytes: {type: integer, format: int64, minimum: 1}, checksum_sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}}}
    UploadIntent: {type: object, required: [id, media_asset_id, upload_url, expires_at], properties: {id: {$ref: '#/components/schemas/UUID'}, media_asset_id: {$ref: '#/components/schemas/UUID'}, upload_url: {type: string, format: uri}, expires_at: {$ref: '#/components/schemas/Timestamp'}}}
    Enrollment: {type: object, required: [id, course_id, student_id, status, completion_percentage], properties: {id: {$ref: '#/components/schemas/UUID'}, course_id: {$ref: '#/components/schemas/UUID'}, student_id: {$ref: '#/components/schemas/UUID'}, status: {type: string, enum: [pending_payment, active, completed, expired, cancelled]}, completion_percentage: {type: number}}}
    ProgressWrite: {type: object, required: [position_seconds, watched_seconds_delta], example: {position_seconds: 540, watched_seconds_delta: 30, manual_complete: false}, properties: {position_seconds: {type: integer, minimum: 0}, watched_seconds_delta: {type: integer, minimum: 0, maximum: 120}, manual_complete: {type: boolean}}}
    Progress: {type: object, required: [lesson_id, state, position_seconds, total_watched_seconds], properties: {lesson_id: {$ref: '#/components/schemas/UUID'}, state: {type: string, enum: [not_started, started, completed]}, position_seconds: {type: integer}, total_watched_seconds: {type: integer}}}
    QuizWrite: {type: object, required: [course_id, title, attempt_limit, pass_percentage], properties: {course_id: {$ref: '#/components/schemas/UUID'}, lesson_id: {$ref: '#/components/schemas/UUID'}, title: {type: string}, instructions: {type: string}, time_limit_seconds: {type: integer, minimum: 1}, attempt_limit: {type: integer, minimum: 1}, pass_percentage: {type: number, minimum: 0, maximum: 100}, randomize_questions: {type: boolean}, randomize_options: {type: boolean}, available_from: {$ref: '#/components/schemas/Timestamp'}, available_until: {$ref: '#/components/schemas/Timestamp'}, results_visibility: {type: string, enum: [immediate, after_close, manual]}, is_required: {type: boolean}}}
    QuestionWrite: {type: object, required: [question_type, prompt, points, position, options], properties: {question_type: {type: string, enum: [single, multiple, true_false, short_answer]}, prompt: {type: string}, points: {type: number, minimum: 0.01}, position: {type: integer, minimum: 1}, options: {type: array, items: {$ref: '#/components/schemas/OptionWrite'}}}}
    OptionWrite: {type: object, required: [text, is_correct, position], properties: {text: {type: string}, is_correct: {type: boolean}, position: {type: integer, minimum: 1}}}
    QuizAttempt: {type: object, required: [id, quiz_id, attempt_number, status, questions, started_at], properties: {id: {$ref: '#/components/schemas/UUID'}, quiz_id: {$ref: '#/components/schemas/UUID'}, attempt_number: {type: integer}, status: {type: string}, questions: {type: array, items: {type: object, additionalProperties: true}, description: Correct-answer flags are never included before submission.}, started_at: {$ref: '#/components/schemas/Timestamp'}, percentage: {type: number}, passed: {type: boolean}}}
    AnswerWrite: {type: object, required: [question_id], example: {question_id: 018f4d4e-8b57-7bf0-a250-3bb54f2ab31a, selected_option_ids: [018f4d4e-8b57-7bf0-a250-3bb54f2ab31b]}, properties: {question_id: {$ref: '#/components/schemas/UUID'}, selected_option_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}, text_answer: {type: string}}}
    AssignmentWrite: {type: object, required: [course_id, title, maximum_score, passing_score, maximum_submissions], properties: {course_id: {$ref: '#/components/schemas/UUID'}, lesson_id: {$ref: '#/components/schemas/UUID'}, title: {type: string}, instructions: {type: string}, attachment_asset_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}, due_at: {$ref: '#/components/schemas/Timestamp'}, maximum_score: {type: number, minimum: 0.01}, passing_score: {type: number, minimum: 0}, allowed_file_types: {type: array, items: {type: string}}, maximum_submissions: {type: integer, minimum: 1}, is_required: {type: boolean}}}
    SubmissionWrite: {type: object, properties: {text_content: {type: string}, media_asset_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}}}
    GradeWrite: {type: object, required: [points], properties: {points: {type: number, minimum: 0}, feedback: {type: string}, question_id: {$ref: '#/components/schemas/UUID'}}}
    LiveSessionWrite: {type: object, required: [course_id, title, scheduled_start_at, scheduled_end_at], properties: {course_id: {$ref: '#/components/schemas/UUID'}, title: {type: string}, description: {type: string}, scheduled_start_at: {$ref: '#/components/schemas/Timestamp'}, scheduled_end_at: {$ref: '#/components/schemas/Timestamp'}}}
    JoinToken: {type: object, required: [token, url, expires_at], properties: {token: {type: string, description: Sensitive short-lived room token; never log it.}, url: {type: string, format: uri}, expires_at: {$ref: '#/components/schemas/Timestamp'}}}
    OrderWrite: {type: object, required: [course_id], example: {course_id: 018f4d4e-8b57-7bf0-a250-3bb54f2ab31a}, properties: {course_id: {$ref: '#/components/schemas/UUID'}}}
    Order: {type: object, required: [id, status, amount_minor, currency], properties: {id: {$ref: '#/components/schemas/UUID'}, status: {type: string, description: 'pending, requires_action, paid, failed, cancelled, or refunded'}, amount_minor: {type: integer, format: int64}, currency: {type: string}}}
    PaymentIntent: {type: object, required: [client_secret], properties: {client_secret: {type: string, description: Sensitive ephemeral provider value; never log it.}}}
    DeviceTokenWrite: {type: object, required: [token, platform], properties: {token: {type: string, description: Sensitive push-provider token; stored encrypted and never logged.}, platform: {type: string, enum: [android, ios, web]}}}
    CertificateVerification: {type: object, required: [valid, student_name, course_title, organization_name, issued_at, certificate_number], properties: {valid: {type: boolean}, student_name: {type: string}, course_title: {type: string}, organization_name: {type: string}, issued_at: {$ref: '#/components/schemas/Timestamp'}, certificate_number: {type: string}}}
